<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PERCIVAL COMMS</title>
<style>
body{margin:0;background:#07090c;color:#eaf2ff;font-family:system-ui;padding:12px}
h1{font-size:14px;letter-spacing:.14em}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.w{background:#0e141c;border:1px solid #243044;border-radius:14px;padding:12px}
h3{margin:0 0 8px;font-size:11px;color:#8b97a8}
a,button{display:inline-block;margin:3px 3px 0 0;padding:7px 9px;border-radius:8px;background:#6ee7ff;color:#042;text-decoration:none;border:0;font-weight:800;font-size:11px}
.gho{background:transparent;color:#6ee7ff;border:1px solid #243044}
textarea{width:100%;min-height:72px;background:#07090c;color:#eaf2ff;border:1px solid #243044;border-radius:8px;padding:8px}
.p{font-size:11px;color:#8b97a8}
.on{color:#5ee0a0}.wait{color:#f0c36a}
</style></head>
<body>
<h1>PERCIVAL · COMMS BOARD</h1>
<p class="p"><span class="on">AUTO: Gmail GitHub Calendar</span> · <span class="wait">SEND: you</span></p>
<p class="p">Flow: ASK → COPY → OPEN → SEND → ORDER ID → LEDGER</p>
<div class="g">
<div class="w"><h3>FIVERR</h3>
<a href="https://www.fiverr.com/inbox" target="_blank">INBOX</a>
<a class="gho" href="https://www.fiverr.com/orders" target="_blank">ORDERS</a>
<textarea id="a">Got the order. Delivering today: 10 Meta hooks, 3 texts, checklist.</textarea>
<button onclick="c(a.value)">COPY</button></div>
<div class="w"><h3>CONTRA</h3>
<a href="https://contra.com" target="_blank">OPEN</a>
<textarea id="b">I can start today. $39 hooks or $149 sprint. Which should I lock?</textarea>
<button onclick="c(b.value)">COPY</button></div>
<div class="w"><h3>LINKEDIN</h3>
<a href="https://www.linkedin.com/messaging" target="_blank">INBOX</a>
<textarea id="d">If first-line fatigue is the issue I can send 10 test hooks same day — $39.</textarea>
<button onclick="c(d.value)">COPY</button></div>
<div class="w"><h3>X</h3>
<a href="https://x.com/messages" target="_blank">DMS</a>
<textarea id="e">If the first 3s is the brand name that's usually the leak, not CPM.</textarea>
<button onclick="c(e.value)">COPY</button></div>
<div class="w"><h3>REDDIT</h3>
<a href="https://www.reddit.com/r/PPC/new" target="_blank">r/PPC</a>
<textarea id="f">If the first 3s is the brand name, that's usually the leak, not CPM.</textarea>
<button onclick="c(f.value)">COPY</button></div>
<div class="w"><h3>EMAIL</h3>
<a href="https://mail.google.com" target="_blank">GMAIL</a>
<textarea id="g">Same-day pack $39 or 7-day sprint $149. Product + audience in one line.</textarea>
<button onclick="c(g.value)">COPY</button></div>
</div>
<script>function c(t){navigator.clipboard.writeText(t)}</script>
</body></html>
